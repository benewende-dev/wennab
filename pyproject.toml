[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wennab"
version = "0.1.0"
description = "Prove that a model optimisation did something, or that it did not."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Benewende Yanncik Rapadamnaba" }]
keywords = ["llm", "quantization", "gguf", "llama.cpp", "arm", "on-device", "benchmarking"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# gguf is the only hard dependency, and only `twin` needs it: the other three
# commands read plain text and JSON on purpose, so they run anywhere — including
# on the 8 GB Arm laptop this was built for.
dependencies = ["gguf>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wennab = "wennab.cli:main"

[project.urls]
Homepage = "https://github.com/benewende-dev/wennab"

[tool.setuptools]
packages = ["wennab"]

[tool.setuptools.package-data]
wennab = ["py.typed"]
