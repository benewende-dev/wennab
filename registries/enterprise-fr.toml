    """SUPPLY AGREEMENT No. {ref}

This agreement is made between {societe}, a company having its registered office in {ville} ("the Supplier"), and {societe2}, having its principal place of business in {ville2} ("the Buyer").""",
    """SERVICE AGREEMENT No. {ref}

Between {societe}, of {ville}, represented by {personne} ("the Provider"), and {societe2}, of {ville2}, represented by {personne2} ("the Client").""",
    """FRAMEWORK PURCHASE AGREEMENT No. {ref}

Entered into on {jour} {month} {annee} between {societe} ("the Seller") and {societe2} ("the Purchaser").""",
  ],
  [
    """
1. Scope
The Supplier shall deliver {quantite} {unit} of {good} in accordance with the technical specification set out in Schedule 1, which forms part of this agreement.""",
    """
1. Subject matter
The Provider shall supply and commission {quantite} {unit} of {good} at the Client's premises in {ville2}. No other service is included unless separately agreed in writing.""",
    """
1. Purpose
This agreement governs the supply of {good} by the Seller to the Purchaser over a period of twelve months, in quantities to be specified in individual purchase orders.""",
  ],
  [
    """
2. Price and payment
The total contract value is {amount} FCFA excluding tax. Payment falls due {delai} days from the date of invoice, by bank transfer to the account nominated by the Supplier.""",
    """
2. Consideration
The firm lump-sum price is {amount} FCFA net of tax and is not subject to revision during the term. A deposit of {pct} % is payable on order, the balance on delivery.""",
    """
2. Payment terms
Invoices are payable within {delai} days. Late payment accrues interest at the statutory rate without further notice.""",
  ],
  [
    """
3. Delivery
Delivery shall be completed no later than {jour} {month} {annee}. Any delay exceeding {delai} days entitles the Buyer to liquidated damages calculated per week commenced, subject to an overall cap.""",
    """
3. Time for performance
The Provider has {delai} calendar days from notification of this agreement to complete the works. Time is of the essence.""",
    """
3. Delivery and risk
Goods are delivered to {ville2}, carriage paid. Risk passes on physical delivery to the Purchaser or its nominated carrier; title passes only on payment in full.""",
  ],
  [
    """
4. Acceptance
The Purchaser has eight working days from delivery to notify defects. Failing such notice, the goods are deemed accepted without reservation.""",
    """
4. Warranty
The Supplier warrants the goods against manufacturing defects for twelve months from delivery. The warranty is limited to replacement of defective parts and excludes damage arising from misuse.""",
    """
4. Inspection
Acceptance is pronounced jointly by both parties. Where reservations are recorded, the Supplier has {delai} days to remedy them at its own cost.""",
  ],
  [
    """
5. Termination
Either party may terminate this agreement for material breach, fifteen days after written notice has remained without effect.

Signed at {ville} on {jour2} {month} {annee}, in two originals.""",
    """
5. Confidentiality
Each party shall keep confidential all information received in the course of performance, for the term of this agreement and three years thereafter.

Signed at {ville} on {jour2} {month} {annee}.""",
    """
5. Governing law
This agreement is governed by the OHADA Uniform Acts and, subsidiarily, by the national law of the place of performance. Disputes shall be referred to the commercial court of {ville}.

Signed in duplicate at {ville}.""",
  ],
]

