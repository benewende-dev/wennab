# A value is drawn as `randrange(min, max) * unit`. Two consequences worth
# stating, because neither is what the words suggest and the output looks
# reasonable either way:
#
#   · max is EXCLUSIVE. { min = 2024, max = 2027 } never yields 2027.
#   · unit MULTIPLIES both bounds, it does not stride between them. The line
#     below draws 755,000 to 95,999,000 FCFA, not 750 to 96,000 — which is the
#     intent here, since these are contract amounts in FCFA.
#
# The field was called `step` until it was renamed for saying the opposite of
# what it did. A registry still using `step` is refused rather than read with
# unit = 1, which would silently divide every amount by a thousand.
[numbers]
montant   = { min = 750, max = 96000, unit = 1000, format = "spaced" }
montant2  = { min = 120, max = 9800,  unit = 1000, format = "spaced" }
amount    = { min = 12,  max = 940,   unit = 1000, format = "grouped" }
jour      = { min = 1,   max = 29 }
jour2     = { min = 1,   max = 29 }
annee     = { min = 2024, max = 2027 }
pct       = { min = 2,   max = 48 }
pct2      = { min = 2,   max = 48 }
delai     = { min = 7,   max = 91 }
quantite  = { min = 12,  max = 4800 }
effectif  = { min = 6,   max = 320 }

[[genres]]
id = "contrat_fr"
language = "fr"
blocks = [
  [
    """CONTRAT DE FOURNITURE N° {ref}

Entre les soussignés : {societe}, société de droit ivoirien au capital de {montant2} FCFA, dont le siège social est situé à {ville}, ci-après dénommée « le Fournisseur », d'une part,""",
    """CONTRAT DE PRESTATION DE SERVICES N° {ref}

Entre : {societe}, dont le siège est établi à {ville}, représentée par {personne} agissant en qualité de directeur général, ci-après « le Prestataire », d'une part,""",
    """MARCHÉ DE FOURNITURES N° {ref}

Le présent marché est conclu entre {societe}, immatriculée au registre du commerce de {ville}, ci-après « le Titulaire », d'une part,""",
  ],
  [
    """et {societe2}, ayant son établissement principal à {ville2}, représentée par {personne2}, ci-après dénommée « le Client », d'autre part.""",
    """et {societe2}, dont le siège est à {ville2}, dûment représentée aux présentes par {personne2}, ci-après « l'Acheteur », d'autre part.""",
    """et {societe2}, établie à {ville2}, ci-après désignée « le Bénéficiaire », d'autre part. Les parties ont convenu ce qui suit.""",
  ],
  [
    """
Article 1 — Objet
Le présent contrat a pour objet la fourniture de {quantite} {unite} de {produit}, selon les spécifications techniques annexées, qui font partie intégrante du contrat.""",
    """
Article 1 — Objet
Le Fournisseur s'engage à livrer au Client {quantite} {unite} de {produit}, conformément au cahier des charges joint en annexe 1, dont les parties reconnaissent avoir pris connaissance.""",
    """
Article 1 — Objet
Le contrat porte sur la fourniture et la mise en service de {quantite} {unite} de {produit} sur le site du Client à {ville2}, à l'exclusion de toute autre prestation.""",
  ],
  [
    """
Article 2 — Prix et modalités de règlement
Le montant total du marché est fixé à {montant} FCFA hors taxes. Le règlement intervient à {delai} jours fin de mois à compter de la réception de la facture, par virement bancaire sur le compte désigné par le Fournisseur.""",
    """
Article 2 — Prix
Le prix global et forfaitaire s'établit à {montant} FCFA HT. Il est ferme et non révisable pendant toute la durée du contrat. Un acompte de {pct} % est versé à la commande, le solde à la livraison.""",
    """
Article 2 — Conditions financières
Le montant du contrat s'élève à {montant} FCFA hors taxes, payable en trois échéances : {pct} % à la signature, {pct2} % au démarrage, le solde après réception définitive.""",
  ],
  [
    """
Article 3 — Délais
La livraison intervient au plus tard le {jour} {mois} {annee}. Tout retard supérieur à {delai} jours ouvre droit, au profit du Client, à une pénalité calculée par semaine entamée et plafonnée en valeur, sans que le Client ait à justifier d'un préjudice.""",
    """
Article 3 — Délai d'exécution
Le Prestataire dispose de {delai} jours calendaires à compter de la notification du présent contrat pour achever les prestations. Ce délai est suspendu en cas de force majeure dûment notifiée dans les quarante-huit heures.""",
    """
Article 3 — Livraison
Les marchandises sont livrées à {ville2}, rendues quai, au plus tard le {jour} {mois} {annee}. Le transfert des risques s'opère à la remise effective au Client ou à son transitaire.""",
  ],
  [
    """
Article 4 — Garantie
Le Fournisseur garantit les fournitures contre tout vice de fabrication pendant douze mois à compter de la réception. La garantie couvre le remplacement des pièces défectueuses, à l'exclusion des dommages résultant d'un défaut d'entretien.""",
    """
Article 4 — Réception
La réception est prononcée contradictoirement en présence des deux parties. En cas de réserves, le Fournisseur dispose de {delai} jours pour y remédier. Passé ce délai, le Client peut faire exécuter les reprises aux frais du Fournisseur.""",
    """
Article 4 — Conformité
Le Client dispose de huit jours ouvrés à compter de la livraison pour formuler ses réserves. À défaut, les fournitures sont réputées acceptées sans réserve.""",
  ],
  [
    """
Article 5 — Résiliation
En cas de manquement grave de l'une des parties à ses obligations, l'autre partie peut résilier le contrat de plein droit, quinze jours après une mise en demeure restée sans effet.""",
    """
Article 5 — Confidentialité
Chaque partie s'interdit de divulguer les informations dont elle a connaissance à l'occasion de l'exécution du contrat, pendant sa durée et les trois années suivant son terme.""",
    """
Article 5 — Sous-traitance
Le Fournisseur ne peut sous-traiter tout ou partie des prestations sans l'accord écrit préalable du Client. L'agrément d'un sous-traitant ne décharge le Fournisseur d'aucune de ses obligations.""",
  ],
  [
    """
Article 6 — Litiges
Tout différend relatif à l'interprétation ou à l'exécution du présent contrat est soumis, à défaut d'accord amiable dans un délai de trente jours, au tribunal de commerce de {ville}.

Fait à {ville}, le {jour2} {mois2} {annee}, en deux exemplaires originaux.""",
    """
Article 6 — Droit applicable
Le présent contrat est régi par les Actes uniformes de l'OHADA et, à titre supplétif, par le droit national du lieu d'exécution.

Fait à {ville}, le {jour2} {mois2} {annee}.""",
    """
Article 6 — Élection de domicile
Les parties élisent domicile aux adresses figurant en tête des présentes. Toute modification doit être notifiée par lettre recommandée.

Fait à {ville}, le {jour2} {mois2} {annee}, en deux exemplaires.""",
  ],
]

[[genres]]
id = "compte_rendu_fr"
language = "fr"
blocks = [
  [
    """COMPTE RENDU DE RÉUNION

Réunion du comité de direction — {ville}, {jour} {mois} {annee}
Présents : {personne}, {personne2}, les responsables de {service}.
Absent excusé : le directeur technique.""",
    """COMPTE RENDU

Revue de projet {ref} — {ville}, le {jour} {mois} {annee}
Animateur : {personne}. Participants : sept personnes, dont les représentants de {service}.""",
    """PROCÈS-VERBAL DE RÉUNION

Objet : point mensuel d'activité — {ville}, {jour} {mois} {annee}
La séance est ouverte à neuf heures par {personne}.""",
  ],
  [
    """
1. Approbation du compte rendu précédent
Le compte rendu de la séance du {jour2} {mois2} est approuvé sans modification.""",
    """
1. Suivi des décisions
Sur les six actions arrêtées lors de la séance précédente, quatre sont soldées, une est en cours et une est reportée faute de disponibilité budgétaire.""",
    """
1. Ouverture
{personne} rappelle l'ordre du jour et précise que les arbitrages attendus portent sur trois points seulement.""",
  ],
  [
    """
2. Activité commerciale
Le chiffre d'affaires du mois s'établit à {montant} FCFA, en progression de {pct} % par rapport au même mois de l'exercice précédent. La croissance provient principalement des ventes de {produit}, tandis que les autres lignes stagnent.""",
    """
2. Situation commerciale
Les commandes enregistrées atteignent {montant} FCFA, soit {pct} % de l'objectif annuel. {personne2} signale que deux clients importants de {ville2} ont décalé leurs engagements au trimestre suivant.""",
    """
2. Ventes
Le carnet de commandes représente {quantite} {unite} à livrer d'ici la fin du trimestre. Le taux de service ressort à {pct} %, en retrait par rapport au mois précédent.""",
  ],
  [
    """
3. Exploitation
Deux ruptures de stock ont été constatées sur {produit}, chacune de {delai} jours. Le service logistique attribue la première à un retard portuaire et la seconde à une commande passée tardivement.""",
    """
3. Production
Le taux d'utilisation des équipements s'établit à {pct} %. Une immobilisation de {delai} jours a été nécessaire pour la maintenance annuelle, opération planifiée mais dont la durée a dépassé la prévision de deux jours.""",
    """
3. Logistique
Sur {quantite} {unite} expédiées, {pct} % sont arrivées dans le délai contractuel. Les retards concernent essentiellement l'axe {ville} — {ville2}, où les contrôles routiers se sont multipliés.""",
  ],
  [
    """
4. Trésorerie
L'encours client atteint {montant2} FCFA, dont une part significative à plus de {delai} jours. {personne} demande qu'une relance systématique soit engagée avant la fin du mois.""",
    """
4. Situation financière
Le délai moyen de règlement clients s'établit à {delai} jours, contre 45 jours l'an dernier. La direction financière propose de conditionner les nouvelles livraisons au règlement des factures échues.""",
    """
4. Budget
Les dépenses engagées représentent {pct} % du budget annuel à mi-exercice. L'écart favorable provient d'un report d'investissement et non d'une économie de fonctionnement.""",
  ],
  [
    """
5. Ressources humaines
L'effectif s'établit à {effectif} personnes. Deux recrutements sont en cours pour {service}. La formation sécurité prévue en {mois2} concernera l'ensemble des opérateurs.""",
    """
5. Personnel
{personne2} indique que le plan de formation a été consommé à {pct} %. Le comité valide le principe d'une session complémentaire à {ville2}.""",
    """
5. Organisation
Le rattachement de {service} est modifié à compter du 1er {mois2}. La note d'organisation correspondante sera diffusée dans la semaine.""",
  ],
  [
    """
6. Décisions
— Relancer les clients dont les factures dépassent {delai} jours, avant le {jour2} {mois2}.
— Constituer un stock de sécurité de {quantite} {unite} de {produit}.
— Reporter l'arbitrage sur l'investissement au prochain comité.

La séance est levée à onze heures trente.""",
    """
6. Actions arrêtées
— {personne} présentera un chiffrage détaillé du projet {ref} avant le {jour2} {mois2}.
— {service} révisera les conditions générales de vente.
— Une réponse écrite sera adressée au fournisseur de {ville2}.

Prochaine réunion le {jour2} {mois2}.""",
    """
6. Conclusions
Le comité valide le principe d'un plan d'action en trois volets et charge {personne2} d'en assurer le suivi. Un point d'étape est fixé dans quinze jours.

La séance est levée.""",
  ],
]

