[[genres]]
id = "rapport_fr"
language = "fr"
blocks = [
  [
    """RAPPORT D'ACTIVITÉ — {mois} {annee}
{societe}, {ville}

1. Synthèse""",
    """NOTE DE SYNTHÈSE TRIMESTRIELLE
{societe} — site de {ville}

1. Vue d'ensemble""",
    """RAPPORT MENSUEL D'EXPLOITATION
{service} — {ville}, {mois} {annee}

1. Faits marquants""",
  ],
  [
    """
L'activité du mois ressort à {montant} FCFA, soit {pct} % de l'objectif. La tendance reste orientée à la hausse, portée par {secteur}, mais elle masque des situations contrastées selon les lignes de produits.""",
    """
Le trimestre se solde par un chiffre d'affaires de {montant} FCFA, en progression de {pct} % sur un an. Cette progression est intégralement imputable au second mois ; les deux autres sont en léger retrait.""",
    """
L'exploitation a été marquée par deux événements : une rupture d'approvisionnement de {delai} jours sur {produit}, et l'ouverture du point de vente de {ville2}, effective depuis le {jour} {mois}.""",
  ],
  [
    """
2. Ventes
Les volumes atteignent {quantite} {unite}, contre une prévision inférieure de {pct2} %. Le prix moyen de vente s'érode légèrement sous l'effet de la concurrence sur l'axe {ville} — {ville2}.""",
    """
2. Commercial
Le nombre de clients actifs s'établit à {effectif}. Trois comptes représentent à eux seuls {pct} % du chiffre d'affaires, ce qui constitue une concentration à surveiller.""",
    """
2. Marché
La demande reste soutenue sur {produit}, dont les volumes progressent de {pct} %. Les autres références sont stables. Aucun nouvel entrant significatif n'a été identifié sur la période.""",
  ],
  [
    """
3. Achats et stocks
La valeur du stock s'établit à {montant2} FCFA, soit {delai} jours de couverture. Deux références sont en surstock et une en tension permanente depuis le début de l'exercice.""",
    """
3. Approvisionnements
Le délai moyen fournisseur atteint {delai} jours, en dégradation. Le fournisseur historique de {ville2} n'a honoré que {pct} % des commandes dans le délai annoncé.""",
    """
3. Logistique
Le coût de transport à la tonne progresse de {pct} %, sous l'effet du prix du carburant et de l'allongement des rotations.""",
  ],
  [
    """
4. Points de vigilance
— La concentration du portefeuille clients.
— L'encours à plus de {delai} jours, qui atteint {montant2} FCFA.
— La dépendance à un fournisseur unique sur {produit}.""",
    """
4. Risques identifiés
— Un litige commercial est en cours avec un client de {ville2} ; le montant en jeu est de {montant2} FCFA.
— Le renouvellement du contrat de maintenance n'est pas engagé.
— Deux postes clés de {service} restent vacants.""",
    """
4. Alertes
L'écart entre le budget et le réalisé atteint {pct} % sur les charges externes. Cet écart n'est pas expliqué à ce stade et fait l'objet d'une analyse par le contrôle de gestion.""",
  ],
  [
    """
5. Perspectives
Le mois de {mois2} devrait bénéficier de la saisonnalité favorable. Sous réserve de la levée des tensions d'approvisionnement, l'objectif annuel reste atteignable.

Rapport établi par {personne}, {service}.""",
    """
5. Actions engagées
Une renégociation des conditions d'achat est ouverte. Le recrutement de deux collaborateurs est lancé. Un plan de réduction du stock dormant sera présenté au prochain comité.

{personne}, {ville}, le {jour2} {mois2} {annee}.""",
    """
5. Recommandations
Il est proposé de conditionner les livraisons des clients en dépassement d'encours, d'ouvrir une seconde source d'approvisionnement et de réviser la tarification avant la fin du trimestre.

{personne}""",
  ],
]

[[genres]]
id = "analyse_fr"
language = "fr"
blocks = [
  [
    """ANALYSE — écart budgétaire {mois} {annee}
{service}, {societe}""",
    """NOTE D'ANALYSE — rentabilité de la ligne {produit}
{societe}, {ville}""",
    """ÉTUDE PRÉALABLE — opportunité d'implantation à {ville2}
{societe}""",
  ],
  [
    """
Le budget de la période prévoyait {montant} FCFA de charges ; le réalisé s'établit à {montant2} FCFA. L'écart est défavorable et se concentre sur deux postes.""",
    """
Le chiffre d'affaires de la ligne atteint {montant} FCFA pour un coût d'achat de {montant2} FCFA. La marge brute qui en découle doit encore supporter les charges de distribution, ce que l'analyse ci-dessous détaille.""",
    """
L'implantation envisagée à {ville2} suppose un investissement initial de {montant} FCFA et des charges de structure annuelles estimées à {montant2} FCFA.""",
  ],
  [
    """
Premier poste : le transport, qui dépasse la prévision de {pct} %. L'analyse des factures montre que l'écart provient pour l'essentiel de trois rotations exceptionnelles vers {ville2}, décidées pour éviter une rupture chez un client important.""",
    """
Le coût de revient unitaire s'établit à un niveau supérieur de {pct} % à celui retenu lors de la construction du tarif. L'écart tient à la hausse du prix d'achat, non répercutée en aval.""",
    """
Le point mort est atteint pour un volume de {quantite} {unite} par an. Le marché local, estimé à partir des données disponibles, permettrait d'atteindre ce seuil au cours de la deuxième année.""",
  ],
  [
    """
Second poste : les charges de personnel, en dépassement de {pct2} %. Le recours aux heures supplémentaires a compensé deux absences prolongées et n'a donc pas de caractère structurel.""",
    """
Deuxième facteur : la remise commerciale moyenne consentie atteint {pct2} %, contre un objectif inférieur. Cette dérive s'observe principalement sur les commandes traitées en fin de mois.""",
    """
Le principal facteur de sensibilité est le taux d'occupation. Une variation de dix points sur cette hypothèse déplace le point mort de près d'un an, ce qui rend la décision dépendante d'une donnée que nous ne maîtrisons pas.""",
  ],
  [
    """
Lecture d'ensemble : sur l'écart total, une part est conjoncturelle et se résorbera d'elle-même ; le reste appelle une décision. Il serait prématuré d'en conclure à une dérive générale des charges.""",
    """
Au total, la ligne reste contributive, mais sa marge s'est réduite. La question posée n'est pas son maintien mais le niveau de prix auquel elle doit être vendue à compter de {mois2}.""",
    """
Ces éléments ne permettent pas de trancher à eux seuls. Ils délimitent les conditions dans lesquelles le projet serait rentable, et celles dans lesquelles il ne le serait pas.""",
  ],
  [
    """
Recommandations
1. Rétablir la validation préalable des transports exceptionnels.
2. Ne pas modifier le budget de personnel avant la fin de l'exercice.
3. Représenter une analyse actualisée au comité de {mois2}.""",
    """
Recommandations
1. Réviser le tarif de {produit} à compter du 1er {mois2}.
2. Encadrer la remise maximale accordée sans validation.
3. Suivre mensuellement le coût de revient unitaire.""",
    """
Suite proposée
1. Confirmer l'hypothèse de volume par une étude de terrain à {ville2}.
2. Chiffrer une variante en location plutôt qu'en acquisition.
3. Différer la décision au prochain exercice.""",
  ],
]

